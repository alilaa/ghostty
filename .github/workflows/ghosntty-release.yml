name: GhosnTTy Linux releases
on:
  push:
    branches: [main, anton/linux-project-tabs-navigation]
    tags: ['ghosntty-v*']
    paths:
      - '.github/workflows/ghosntty-release.yml'
      - 'contrib/ghosntty/**'
      - 'src/**'
      - 'build.zig'
      - 'build.zig.zon'
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_REF: ${{ github.ref_name }}
  REF_TYPE: ${{ github.ref_type }}

concurrency:
  group: ghosntty-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ubuntu:
    if: github.repository == 'alilaa/ghostty'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ubuntu build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl pkg-config gettext \
            blueprint-compiler libadwaita-1-dev libgtk-4-dev libgtk4-layer-shell-dev \
            libbz2-dev libonig-dev libxml2-utils libfreetype-dev libfontconfig-dev \
            libharfbuzz-dev libpng-dev zlib1g-dev python3-gi neovim dpkg-dev \
            desktop-file-utils xvfb xauth dbus-x11 libgl1-mesa-dri meson ninja-build
      - name: Install Blueprint compiler 0.22.2
        run: bash contrib/ghosntty/ci/install-blueprint.sh "$RUNNER_TEMP/ghosntty-blueprint"
      - name: Install checksum-verified Zig 0.17.0
        run: bash contrib/ghosntty/ci/install-zig.sh "$RUNNER_TEMP/ghosntty-zig"
      - name: Determine version
        run: bash contrib/ghosntty/ci/version.sh
      - name: Build and test on Ubuntu 26.04
        run: bash contrib/ghosntty/ci/build.sh "$RUNNER_TEMP/ghosntty-prefix"
      - name: Package and verify Ubuntu install
        run: |
          bash contrib/ghosntty/package-deb.sh "$RUNNER_TEMP/ghosntty-prefix" dist "$PACKAGE_VERSION"
          sudo apt-get install -y ./dist/*.deb
          ghosntty --version
          if ldd /usr/lib/ghosntty/bin/ghostty | grep -q 'not found'; then exit 1; fi
          xvfb-run -a dbus-run-session -- /usr/bin/python3 contrib/ghosntty/tests/smoke_desktop.py
          bash contrib/ghosntty/ci/manifest.sh > dist/ghosntty-ubuntu26.04-x86_64-build-info.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GhosnTTy-Ubuntu-26.04-x86_64
          path: |
            dist/*.deb
            dist/*-build-info.txt
          if-no-files-found: error

  arch:
    if: github.repository == 'alilaa/ghostty'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash
    env:
      # Matches this desktop's glibc 2.44 and GTK 4.22.5, rather than newer GTK.
      ARCH_SNAPSHOT: '2026/10/01'
      XDG_RUNTIME_DIR: /home/builder/.runtime
    steps:
      - name: Install pinned Arch build and runtime dependencies
        run: |
          printf 'Server = https://archive.archlinux.org/repos/%s/$repo/os/$arch\n' "$ARCH_SNAPSHOT" > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm --needed git curl pkgconf glib2-devel \
            blueprint-compiler libadwaita gtk4 gtk4-layer-shell \
            freetype2 harfbuzz fontconfig libpng zlib oniguruma libxml2 \
            python python-gobject neovim desktop-file-utils \
            xorg-server-xvfb xorg-xauth dbus mesa \
            ttf-jetbrains-mono-nerd noto-fonts-emoji
          useradd --create-home builder
          install -d -m700 -o builder -g builder /home/builder/.runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Allow unprivileged package builds
        run: chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Install checksum-verified Zig 0.17.0
        run: bash contrib/ghosntty/ci/install-zig.sh /opt/ghosntty-zig
      - name: Determine version
        run: bash contrib/ghosntty/ci/version.sh
      - name: Build and test on Arch
        run: |
          runuser -u builder -- env BUILD_VERSION="$BUILD_VERSION" PATH="$PATH" \
            bash contrib/ghosntty/ci/build.sh /home/builder/ghosntty-prefix
      - name: Package and verify Arch install
        run: |
          runuser -u builder -- bash contrib/ghosntty/package-arch.sh \
            /home/builder/ghosntty-prefix "$GITHUB_WORKSPACE/dist" "$PACKAGE_VERSION"
          pacman -U --noconfirm dist/*.pkg.tar.zst
          ghosntty --version
          if ldd /usr/lib/ghosntty/bin/ghostty | grep -q 'not found'; then exit 1; fi
          runuser -u builder -- xvfb-run -a dbus-run-session -- \
            /usr/bin/python3 contrib/ghosntty/tests/smoke_desktop.py
          runuser -u builder -- env BUILD_VERSION="$BUILD_VERSION" PATH="$PATH" \
            bash contrib/ghosntty/ci/manifest.sh > dist/ghosntty-arch-x86_64-build-info.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GhosnTTy-Arch-x86_64
          path: |
            dist/*.pkg.tar.zst
            dist/*-build-info.txt
          if-no-files-found: error

  publish:
    needs: [ubuntu, arch]
    if: startsWith(github.ref, 'refs/tags/ghosntty-v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: GhosnTTy-*
          merge-multiple: true
          # Not dist/: the checkout has upstream's dist/ directories, which the upload would include.
          path: release
      - name: Determine version
        run: bash contrib/ghosntty/ci/version.sh
      - name: Generate checksums
        working-directory: release
        run: sha256sum *.deb *.pkg.tar.zst *-build-info.txt > SHA256SUMS
      - name: Publish both platforms together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_REF" >/dev/null 2>&1; then
            gh release upload "$RELEASE_REF" release/* --clobber
          else
            gh release create "$RELEASE_REF" release/* --verify-tag \
              --title "GhosnTTy $PACKAGE_VERSION" --notes-file contrib/ghosntty/RELEASE.md
          fi
